<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой умный планер</title>
        <!-- Красивые шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <!-- Меню навигации -->
    <div class="nav-menu">
        <button onclick="showTab('tasks')" id="btn-tasks" class="nav-btn active">✨ Мои задачи</button>
        <button onclick="showTab('calendar')" id="btn-calendar" class="nav-btn">🌿 Календарь</button>
        <!-- НОВАЯ ВКЛАДКА -->
        <button onclick="showTab('trackers')" id="btn-trackers" class="nav-btn">🌸 Трекеры</button>
    </div>

    <!-- Экран 1: Задачи -->
    <div class="planner-container" id="tab-tasks">
        <h2 id="greeting">Привет!</h2>
        <div class="date-display" id="current-date"></div>

        <!-- Прогресс -->
        <div class="progress-container">
            <div class="progress-text">
                <span>Прогресс дня:</span>
                <span id="progress-count">0 / 0</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Ввод -->
       <div class="input-group" style="flex-wrap: wrap;">
    <input type="text" id="task-input" placeholder="Что нужно сделать?" autocomplete="off" style="flex: 1 1 100%; margin-bottom: 10px;">
    <div style="display: flex; gap: 10px; width: 100%;">
        <select id="task-category" style="flex: 1;">
            <option value="работа">💼 Работа</option>
            <option value="учеба">📚 Учеба</option>
            <option value="личное">🏠 Личное</option>
        </select>
        <input type="date" id="task-date" style="padding: 12px; border-radius: 8px; background-color: #2c2c2c; color: white; border: none; outline: none; cursor: pointer; flex: 1;">
        <button onclick="addTask()">+</button>
    </div>
</div>

        <ul id="task-list"></ul>

        <button class="clear-btn" onclick="clearCompleted()">Удалить выполненные</button>
    </div>

    <!-- Экран 2: Календарь (Пока пустой) -->
        <!-- Экран 2: Календарь -->
    <div class="planner-container" id="tab-calendar" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Календарь</h2>
            <div style="font-size: 18px; font-weight: bold; color: #bb86fc;" id="calendar-month-year">Загрузка...</div>
        </div>

        <!-- Сетка календаря -->
        <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center;">
            <!-- Дни недели -->
            <div style="color: #888; font-weight: bold;">Пн</div>
            <div style="color: #888; font-weight: bold;">Вт</div>
            <div style="color: #888; font-weight: bold;">Ср</div>
            <div style="color: #888; font-weight: bold;">Чт</div>
            <div style="color: #888; font-weight: bold;">Пт</div>
            <div style="color: #888; font-weight: bold;">Сб</div>
            <div style="color: #888; font-weight: bold;">Вс</div>
            <!-- Сюда JavaScript вставит сами дни -->
        </div>
    </div>
    <!-- Экран 3: Трекеры -->
    <div class="planner-container" id="tab-trackers" style="display: none; max-width: 800px;">
        <h2 style="text-align: center; margin-bottom: 30px;">Мои Трекеры</h2>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">

            <!-- ВОДА -->
            <div class="tracker-card">
                <h3>💧 Вода</h3>
                <p>Выпито стаканов: <span id="water-count">0</span> / 8</p>
                <button onclick="addWater()" class="tracker-btn">+ Выпить стакан</button>
            </div>

            <!-- СПОРТ -->
            <div class="tracker-card">
                <h3>🏃‍♀️ Спорт</h3>
                <p>Тренировка сегодня: <span id="sport-status">Нет ❌</span></p>
                <button onclick="toggleSport()" class="tracker-btn">Отметить тренировку</button>
            </div>

            <!-- СОН -->
            <div class="tracker-card">
                <h3>🌙 Сон</h3>
                <p>Часов сна: <span id="sleep-count">0</span></p>
                <div style="display: flex; gap: 10px;">
                    <button onclick="addSleep()" class="tracker-btn" style="flex: 1;">+1 час</button>
                    <button onclick="resetSleep()" class="tracker-btn" style="flex: 1; background-color: #EAE6F0; color: #4A4A4A;">Сброс</button>
                </div>
            </div>

        </div>
    </div>
    <!-- Подключаем наш скрипт в самом конце! -->
    <script src="script.js"></script>
</body>
</html>
